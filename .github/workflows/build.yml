name: "Build iOS app"

# on: [push]
on: [workflow_dispatch]

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: build archive and ipaify
        run: |
          wget -O archive.zip "https://www.dropbox.com/scl/fi/gbpsttq9233x0t04nwdos/65b5ba2e-abe2-11f1-a3f2-f020ff026637.zip?rlkey=xuq5z3hw0q3d5onfd5lqxdmny&dl=1"
          unzip archive.zip -d .

          xcodebuild archive -project "Dice Roll Prototype.xcodeproj" -scheme "Dice Roll Prototype" -archivePath "Dice Roll Prototype.xcarchive" -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

          mkdir Payload
          mv "Dice Roll Prototype.xcarchive/Products/Applications/Dice Roll Prototype.app" "Payload/Dice Roll Prototype.app"

          zip -r "Dice Roll Prototype.ipa" "Payload"

          mv "Dice Roll Prototype.ipa" "${{ runner.temp }}/Dice Roll Prototype.ipa"


      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Dice Roll Prototype
          path: ${{ runner.temp }}/Dice Roll Prototype.ipa
          # you can also archive the entire directory
          # path: ${{ runner.temp }}/build
          retention-days: 3